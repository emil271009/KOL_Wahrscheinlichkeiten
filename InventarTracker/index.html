<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventar-Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --bg2:       #f5f5f3;
      --bg3:       #eeecea;
      --text:      #1a1a18;
      --muted:     #888780;
      --border:    rgba(0,0,0,0.11);
      --border2:   rgba(0,0,0,0.18);
      --rmd:       8px;
      --rlg:       12px;
      --low:       #D85A30;
      --check-bg:  #EAF3DE;
      --check-bd:  #3B6D11;
      --check-tick:#27500A;
      --sidebar:   220px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #1e1e1c;
        --bg2:       #2a2a28;
        --bg3:       #333330;
        --text:      #f0ede6;
        --muted:     #888780;
        --border:    rgba(255,255,255,0.10);
        --border2:   rgba(255,255,255,0.18);
        --check-bg:  #27500A;
        --check-bd:  #639922;
        --check-tick:#C0DD97;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg2);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Shell ────────────────────────────────────────────────────── */
    .shell { display: flex; flex-direction: column; min-height: 100vh; }

    .topbar {
      padding: .9rem 1.25rem;
      border-bottom: .5px solid var(--border);
      background: var(--bg);
    }
    .topbar h1 { font-size: 18px; font-weight: 500; }

    .body { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ──────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar);
      flex-shrink: 0;
      background: var(--bg);
      border-right: .5px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem .875rem;
      gap: 10px;
    }

    .sidebar-title {
      font-size: 11px; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
    }

    /* Button: neue Kategorie öffnen */
    .btn-new-cat {
      width: 100%; height: 32px;
      background: none; border: .5px solid var(--border2);
      border-radius: var(--rmd); font-size: 12px; color: var(--text);
      cursor: pointer; transition: background .15s;
    }
    .btn-new-cat:hover { background: var(--bg2); }

    /* Eingabezeile neue Kategorie */
    .new-cat-row { display: none; gap: 6px; }
    .new-cat-row.open { display: flex; }
    .new-cat-row input {
      flex: 1; height: 30px; padding: 0 8px; font-size: 12px;
      color: var(--text); background: var(--bg2);
      border: .5px solid var(--border2); border-radius: var(--rmd); outline: none;
    }
    .new-cat-row button {
      height: 30px; padding: 0 10px; font-size: 12px;
      background: var(--text); color: var(--bg);
      border: none; border-radius: var(--rmd); cursor: pointer;
    }

    .err-cat { font-size: 11px; color: var(--low); min-height: 14px; }

    /* Kategorie-Liste in der Sidebar */
    .cat-list { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }

    .cat-item {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; border-radius: var(--rmd);
      cursor: pointer; font-size: 13px; color: var(--text);
      border: .5px solid transparent;
      transition: background .15s;
    }
    .cat-item:hover { background: var(--bg2); }
    .cat-item.active { background: var(--bg3); border-color: var(--border2); font-weight: 500; }
    .cat-item .cat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-item .cat-count { font-size: 11px; color: var(--muted); }
    .cat-item .cat-del-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 11px; padding: 2px; line-height: 1;
      opacity: 0; transition: opacity .15s, color .15s;
    }
    .cat-item:hover .cat-del-btn { opacity: 1; }
    .cat-item .cat-del-btn:hover { color: #E24B4A; }

    .sidebar-sep { height: .5px; background: var(--border); margin: 2px 0; }

    .restore-hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .restore-btn {
      background: none; border: none; color: var(--muted);
      font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0;
    }
    .restore-btn:hover { color: var(--text); }

    /* ── Main ─────────────────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Formular + Stat-Kachel */
    .top-strip {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 1rem 1.25rem;
      border-bottom: .5px solid var(--border);
      background: var(--bg);
    }

    .form-card {
      flex: 1;
      background: var(--bg2);
      border: .5px solid var(--border);
      border-radius: var(--rlg);
      padding: .875rem 1rem;
    }

    .form-head { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-weight: 500; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr 72px; gap: 8px; }
    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .field input, .field select {
      width: 100%; height: 34px; padding: 0 9px;
      font-size: 13px; color: var(--text);
      background: var(--bg); border: .5px solid var(--border2);
      border-radius: var(--rmd); outline: none; transition: border-color .15s;
    }
    .field input:focus, .field select:focus { border-color: rgba(128,128,128,.5); }

    .btn-add {
      width: 100%; margin-top: 8px; height: 34px;
      background: var(--text); color: var(--bg);
      border: none; border-radius: var(--rmd);
      font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s;
    }
    .btn-add:hover { opacity: .8; }

    /* Stat-Kachel rechts: Anzahl Artikel in gewählter Kategorie */
    .stat-card {
      width: 110px; flex-shrink: 0;
      background: var(--bg2); border: .5px solid var(--border);
      border-radius: var(--rlg); padding: .875rem 1rem;
      display: flex; flex-direction: column; justify-content: center;
    }
    .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.35; }
    .stat-value { font-size: 28px; font-weight: 500; }

    /* ── Content: Suche + Liste ───────────────────────────────────── */
    .content {
      flex: 1; overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex; flex-direction: column; gap: 12px;
    }

    #search {
      width: 100%; height: 34px; padding: 0 10px; font-size: 13px;
      color: var(--text); background: var(--bg);
      border: .5px solid var(--border); border-radius: var(--rmd); outline: none;
    }
    #search:focus { border-color: rgba(128,128,128,.5); }

    /* Fortschrittsleiste (nur bei Listen-Kategorien) */
    .list-progress { display: none; align-items: center; gap: 10px; }
    .list-progress.visible { display: flex; }
    .progress-bar { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; background: var(--check-bd); transition: width .3s; }
    .progress-lbl { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .list-header {
      font-size: 13px; font-weight: 500; color: var(--text);
      padding-bottom: 4px; border-bottom: .5px solid var(--border);
    }

    /* ── Artikelliste ─────────────────────────────────────────────── */
    .item-list { display: flex; flex-direction: column; gap: 5px; }

    .item {
      background: var(--bg); border: .5px solid var(--border);
      border-radius: var(--rmd); padding: .65rem .9rem; transition: opacity .2s;
    }
    .item.checked { opacity: .5; }
    .item.checked .item-name { text-decoration: line-through; color: var(--muted); }

    .item-row { display: flex; align-items: center; gap: 9px; }

    /* Custom Checkbox (nur bei Packliste / Einkaufsliste) */
    .check-wrap { flex-shrink: 0; width: 18px; height: 18px; cursor: pointer; display: none; }
    .check-wrap input { display: none; }
    .check-box {
      width: 18px; height: 18px; border-radius: 4px;
      border: .5px solid var(--border2); background: var(--bg2);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
    }
    .check-box svg { opacity: 0; transition: opacity .15s; }
    .check-wrap input:checked ~ .check-box { background: var(--check-bg); border-color: var(--check-bd); }
    .check-wrap input:checked ~ .check-box svg { opacity: 1; }

    .item-name { flex: 1; font-size: 14px; font-weight: 500; }
    .item-cat  { font-size: 11px; padding: 2px 7px; background: var(--bg2); color: var(--muted); border-radius: var(--rmd); white-space: nowrap; }

    .list-badge { font-size: 11px; padding: 2px 7px; border-radius: var(--rmd); font-weight: 500; white-space: nowrap; }
    .list-badge.pack { background: #E1F5EE; color: #085041; }
    .list-badge.shop { background: #E6F1FB; color: #0C447C; }

    .qty-ctrl { display: flex; align-items: center; gap: 3px; }
    .qty-btn {
      width: 24px; height: 24px; background: none;
      border: .5px solid var(--border); border-radius: var(--rmd);
      font-size: 14px; cursor: pointer; color: var(--text);
      display: flex; align-items: center; justify-content: center; transition: background .12s;
    }
    .qty-btn:hover { background: var(--bg2); }
    .qty-val { font-size: 13px; font-weight: 500; min-width: 24px; text-align: center; }
    .qty-val.low { color: var(--low); }

    .icon-btn {
      background: none; border: none; cursor: pointer; color: var(--muted);
      padding: 3px; border-radius: 4px; display: flex; align-items: center; transition: color .15s;
    }
    .icon-btn.edit:hover { color: var(--text); }
    .icon-btn.del:hover  { color: #E24B4A; }

    /* Bearbeitungszeile */
    .edit-row {
      display: none; grid-template-columns: 1fr 1fr; gap: 7px;
      margin-top: 9px; padding-top: 9px; border-top: .5px solid var(--border);
    }
    .edit-row.open { display: grid; }
    .edit-row input, .edit-row select {
      height: 32px; padding: 0 8px; font-size: 12px; color: var(--text);
      background: var(--bg2); border: .5px solid var(--border);
      border-radius: var(--rmd); outline: none; width: 100%;
    }
    .edit-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .edit-actions { display: flex; gap: 5px; margin-top: 7px; }
    .btn-save {
      flex: 1; height: 30px; background: var(--text); color: var(--bg);
      border: none; border-radius: var(--rmd); font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity .15s;
    }
    .btn-save:hover { opacity: .8; }
    .btn-cancel {
      flex: 1; height: 30px; background: none; border: .5px solid var(--border);
      border-radius: var(--rmd); font-size: 12px; color: var(--text); cursor: pointer; transition: background .15s;
    }
    .btn-cancel:hover { background: var(--bg2); }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 13px; }

    /* ── Responsive: Mobile ───────────────────────────────────────── */
    @media (max-width: 600px) {
      .body { flex-direction: column; }
      .sidebar {
        width: 100%; flex-direction: row; flex-wrap: wrap;
        border-right: none; border-bottom: .5px solid var(--border);
        padding: .75rem 1rem; gap: 8px;
      }
      .sidebar .cat-list { flex-direction: row; flex-wrap: wrap; overflow: visible; }
      .sidebar .sidebar-title { width: 100%; }
      .sidebar .new-cat-row, .sidebar .restore-hint { width: 100%; }
      .top-strip { flex-wrap: wrap; }
      .stat-card { width: 100%; }
      .form-grid { grid-template-columns: 1fr 1fr; }
      .form-grid .field:first-child { grid-column: span 2; }
      .edit-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Topbar -->
  <div class="topbar"><h1>Inventar-Tracker</h1></div>

  <div class="body">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="sidebar-title">Kategorien verwalten</div>

      <!-- Neue Kategorie hinzufügen -->
      <button class="btn-new-cat" id="btn-open-new-cat">+ Kategorie hinzufügen</button>
      <div class="new-cat-row" id="new-cat-row">
        <input type="text" id="inp-new-cat" placeholder="Name..." maxlength="30" autocomplete="off" />
        <button id="btn-cat-add">OK</button>
      </div>
      <div class="err-cat" id="err-cat"></div>

      <!-- Klickbare Kategorie-Einträge -->
      <div class="cat-list" id="cat-list"></div>

      <!-- Wiederherstellung gelöschter Standardkategorien -->
      <div id="restore-area" style="display:none">
        <div class="sidebar-sep"></div>
        <div class="restore-hint">
          Gelöscht: <span id="deleted-list"></span><br>
          <button class="restore-btn" id="btn-restore">Alle wiederherstellen</button>
        </div>
      </div>
    </aside>

    <!-- ── Main ── -->
    <main class="main">

      <!-- Formular + Stat-Kachel -->
      <div class="top-strip">
        <div class="form-card">
          <div class="form-head" id="form-head">Artikel hinzufügen</div>
          <div class="form-grid">
            <div class="field">
              <label for="inp-name">Name</label>
              <input type="text" id="inp-name" placeholder="z.B. Laptop" autocomplete="off" />
            </div>
            <div class="field">
              <label for="inp-cat">Kategorie</label>
              <select id="inp-cat"></select>
            </div>
            <div class="field">
              <label for="inp-qty">Menge</label>
              <input type="number" id="inp-qty" min="0" value="1" />
            </div>
          </div>
          <button class="btn-add" id="btn-add">+ Hinzufügen</button>
        </div>

        <!-- Stat-Kachel: Anzahl Artikel in ausgewählter Kategorie -->
        <div class="stat-card">
          <div class="stat-label" id="stat-label">Alle<br>Kategorien</div>
          <div class="stat-value" id="stat-value">0</div>
        </div>
      </div>

      <!-- Inhalt: Suche + Fortschritt + Liste -->
      <div class="content">
        <input type="text" id="search" placeholder="Suchen…" autocomplete="off" />

        <!-- Fortschrittsleiste (nur bei Packliste / Einkaufsliste) -->
        <div class="list-progress" id="list-progress">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
          <span class="progress-lbl" id="progress-lbl">0 / 0</span>
        </div>

        <div class="list-header" id="list-header">Alle Artikel</div>
        <div class="item-list" id="item-list"></div>
        <div class="empty" id="empty" style="display:none">Keine Artikel gefunden.</div>
      </div>
    </main>
  </div>
</div>

<script>
  // ── 1. Konstanten ─────────────────────────────────────────────────────
  const ALL_BUILTIN = [
    'Packliste','Einkaufsliste',
    'Elektronik','Büro','Werkzeug','Lebensmittel','Kleidung','Sonstiges'
  ];
  const LIST_CATS = new Set(['Packliste','Einkaufsliste']);

  // ── 2. State ──────────────────────────────────────────────────────────
  let items=[], customCats=[], deletedBuiltin=[], activeCat='';
  try {
    items          = JSON.parse(localStorage.getItem('inventar_items')    || '[]');
    customCats     = JSON.parse(localStorage.getItem('inventar_cats')     || '[]');
    deletedBuiltin = JSON.parse(localStorage.getItem('inventar_del_cats') || '[]');
  } catch(e) {}

  function builtinActive() { return ALL_BUILTIN.filter(c => !deletedBuiltin.includes(c)); }
  function allCats()       { return [...builtinActive(), ...customCats]; }

  function save() {
    localStorage.setItem('inventar_items',    JSON.stringify(items));
    localStorage.setItem('inventar_cats',     JSON.stringify(customCats));
    localStorage.setItem('inventar_del_cats', JSON.stringify(deletedBuiltin));
  }
  function uid()      { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function esc(s)     { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── 3. Sidebar rendern ────────────────────────────────────────────────
  function renderSidebar() {
    const cats = allCats();
    const list = document.getElementById('cat-list');

    // "Alle"-Eintrag + eine Zeile pro Kategorie
    list.innerHTML = [
      `<div class="cat-item${activeCat==='' ? ' active' : ''}" data-cat="">
        <span class="cat-name">Alle</span>
        <span class="cat-count">${items.length}</span>
      </div>`
    ].concat(cats.map(c => {
      const count = items.filter(i => i.cat === c).length;
      return `<div class="cat-item${activeCat===c ? ' active' : ''}" data-cat="${esc(c)}">
        <span class="cat-name">${esc(c)}</span>
        <span class="cat-count">${count}</span>
        <button class="cat-del-btn" data-del="${esc(c)}" title="Löschen">&#x2715;</button>
      </div>`;
    })).join('');

    // Wiederherstellungs-Bereich
    const restoreArea = document.getElementById('restore-area');
    if (deletedBuiltin.length > 0) {
      document.getElementById('deleted-list').textContent = deletedBuiltin.join(', ');
      restoreArea.style.display = 'block';
    } else { restoreArea.style.display = 'none'; }

    // Formular-Dropdown synchron halten
    const selCat  = document.getElementById('inp-cat');
    const prevCat = selCat.value;
    selCat.innerHTML = cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if (cats.includes(prevCat)) selCat.value = prevCat;
    else if (activeCat && cats.includes(activeCat)) selCat.value = activeCat;
  }

  // ── 4. Stat-Kachel + Überschriften ───────────────────────────────────
  // Das Kästchen rechts zeigt immer die Artikelzahl der aktiven Kategorie.
  function updateStat() {
    const labelEl = document.getElementById('stat-label');
    const valEl   = document.getElementById('stat-value');
    const headEl  = document.getElementById('form-head');
    const hdrEl   = document.getElementById('list-header');

    if (activeCat === '') {
      labelEl.innerHTML  = 'Alle<br>Kategorien';
      valEl.textContent  = items.length;
      headEl.textContent = 'Artikel hinzufügen';
      hdrEl.textContent  = 'Alle Artikel';
    } else {
      labelEl.innerHTML  = 'Artikel in<br><strong style="font-weight:500">' + esc(activeCat) + '</strong>';
      valEl.textContent  = items.filter(i => i.cat === activeCat).length;
      headEl.textContent = 'Artikel aus „' + activeCat + '"';
      hdrEl.textContent  = activeCat;
    }
  }

  // ── 5. Fortschrittsleiste ─────────────────────────────────────────────
  function updateProgress() {
    const prog = document.getElementById('list-progress');
    if (!LIST_CATS.has(activeCat)) { prog.classList.remove('visible'); return; }
    prog.classList.add('visible');
    const inCat   = items.filter(i => i.cat === activeCat);
    const checked = inCat.filter(i => i.checked).length;
    const total   = inCat.length;
    const pct     = total === 0 ? 0 : Math.round(checked / total * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-lbl').textContent  = checked + ' / ' + total;
  }

  // ── 6. Artikelliste rendern ───────────────────────────────────────────
  function render() {
    const q    = document.getElementById('search').value.toLowerCase();
    const cats = allCats();

    const filtered = items.filter(i =>
      i.name.toLowerCase().includes(q) && (activeCat === '' || i.cat === activeCat)
    );

    const list  = document.getElementById('item-list');
    const empty = document.getElementById('empty');
    list.innerHTML = '';

    if (filtered.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      filtered.forEach(item => {
        const isListItem = LIST_CATS.has(item.cat);
        const el = document.createElement('div');
        el.className = 'item' + (item.checked ? ' checked' : '');
        el.dataset.id = item.id;

        const catOpts = cats.map(c =>
          `<option value="${esc(c)}"${c === item.cat ? ' selected' : ''}>${esc(c)}</option>`
        ).join('');

        const badgeClass = item.cat === 'Packliste' ? 'pack' : 'shop';

        el.innerHTML = `
          <div class="item-row">
            <label class="check-wrap" style="display:${isListItem ? 'block' : 'none'}"
              title="${item.checked ? 'Abhaken rückgängig' : 'Als erledigt markieren'}">
              <input type="checkbox" data-action="check" data-id="${item.id}"${item.checked ? ' checked' : ''}>
              <div class="check-box">
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none"
                     stroke="var(--check-tick)" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="2,6 5,9 10,3"/>
                </svg>
              </div>
            </label>
            <span class="item-name">${esc(item.name)}</span>
            ${isListItem
              ? `<span class="list-badge ${badgeClass}">${esc(item.cat)}</span>`
              : `<span class="item-cat">${esc(item.cat)}</span>`
            }
            <div class="qty-ctrl">
              <button class="qty-btn" data-action="dec" data-id="${item.id}">&#x2212;</button>
              <span class="qty-val${item.qty < 5 ? ' low' : ''}">${item.qty}</span>
              <button class="qty-btn" data-action="inc" data-id="${item.id}">+</button>
            </div>
            <button class="icon-btn edit" data-action="edit" data-id="${item.id}" title="Bearbeiten">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"
                   stroke="currentColor" stroke-width="1.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 2l3 3-9 9H2v-3L11 2z"/>
              </svg>
            </button>
            <button class="icon-btn del" data-action="del" data-id="${item.id}" title="Löschen">&#x2715;</button>
          </div>
          <div class="edit-row" id="edit-${item.id}">
            <div><label>Name</label><input type="text" class="edit-name" value="${esc(item.name)}" maxlength="80"/></div>
            <div><label>Kategorie</label><select class="edit-cat">${catOpts}</select></div>
            <div><label>Menge</label><input type="number" class="edit-qty" value="${item.qty}" min="0"/></div>
            <div style="display:flex;align-items:flex-end">
              <div class="edit-actions" style="width:100%">
                <button class="btn-save"   data-action="save"   data-id="${item.id}">Speichern</button>
                <button class="btn-cancel" data-action="cancel" data-id="${item.id}">Abbrechen</button>
              </div>
            </div>
          </div>
        `;
        list.appendChild(el);
      });
    }

    renderSidebar();
    updateStat();
    updateProgress();
  }

  // ── 7. Sidebar-Klicks ─────────────────────────────────────────────────
  document.getElementById('cat-list').addEventListener('click', e => {
    // Kategorie löschen
    const delBtn = e.target.closest('.cat-del-btn');
    if (delBtn) {
      const cat = delBtn.dataset.del;
      if (items.some(i => i.cat === cat)) {
        document.getElementById('err-cat').textContent = `"${cat}" wird noch verwendet.`; return;
      }
      document.getElementById('err-cat').textContent = '';
      if (ALL_BUILTIN.includes(cat)) deletedBuiltin.push(cat);
      else customCats = customCats.filter(c => c !== cat);
      if (activeCat === cat) activeCat = '';
      save(); render(); return;
    }
    // Kategorie auswählen (Filter)
    const catItem = e.target.closest('.cat-item');
    if (catItem) {
      activeCat = catItem.dataset.cat;
      const sel = document.getElementById('inp-cat');
      if (activeCat && [...sel.options].some(o => o.value === activeCat)) sel.value = activeCat;
      render();
    }
  });

  // ── 8. Neue Kategorie ─────────────────────────────────────────────────
  document.getElementById('btn-open-new-cat').addEventListener('click', () => {
    const row = document.getElementById('new-cat-row');
    row.classList.toggle('open');
    if (row.classList.contains('open')) document.getElementById('inp-new-cat').focus();
  });

  document.getElementById('btn-cat-add').addEventListener('click', () => {
    const inp  = document.getElementById('inp-new-cat');
    const err  = document.getElementById('err-cat');
    const name = inp.value.trim();
    if (!name) { err.textContent = 'Name eingeben.'; return; }
    if (allCats().map(c => c.toLowerCase()).includes(name.toLowerCase())) {
      err.textContent = 'Existiert bereits.'; return; }
    if (deletedBuiltin.map(c => c.toLowerCase()).includes(name.toLowerCase())) {
      err.textContent = 'Tipp: Unten wiederherstellen.'; return; }
    err.textContent = '';
    customCats.push(name);
    save(); inp.value = '';
    document.getElementById('new-cat-row').classList.remove('open');
    render();
  });

  document.getElementById('inp-new-cat').addEventListener('keydown', e => {
    if (e.key === 'Enter')  document.getElementById('btn-cat-add').click();
    if (e.key === 'Escape') document.getElementById('new-cat-row').classList.remove('open');
  });

  // ── 9. Standardkategorien wiederherstellen ────────────────────────────
  document.getElementById('btn-restore').addEventListener('click', () => {
    deletedBuiltin = [];
    document.getElementById('err-cat').textContent = '';
    save(); render();
  });

  // ── 10. Artikel-Aktionen (Event-Delegation) ───────────────────────────
  document.getElementById('item-list').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const { action, id } = btn.dataset;

    if (action === 'check') {
      const item = items.find(i => i.id === id);
      if (item) item.checked = btn.checked;
      save(); render();
    } else if (action === 'del') {
      items = items.filter(i => i.id !== id);
      save(); render();
    } else if (action === 'inc' || action === 'dec') {
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (action === 'inc') item.qty += 1;
      if (action === 'dec' && item.qty > 0) item.qty -= 1;
      save(); render();
    } else if (action === 'edit') {
      document.querySelectorAll('.edit-row.open').forEach(r => {
        if (r.id !== `edit-${id}`) r.classList.remove('open');
      });
      document.getElementById(`edit-${id}`)?.classList.toggle('open');
    } else if (action === 'save') {
      const row     = document.getElementById(`edit-${id}`);
      const newName = row.querySelector('.edit-name').value.trim();
      const newCat  = row.querySelector('.edit-cat').value;
      const newQty  = parseInt(row.querySelector('.edit-qty').value, 10);
      if (!newName || isNaN(newQty) || newQty < 0) return;
      const item = items.find(i => i.id === id);
      if (item) {
        item.name = newName; item.cat = newCat; item.qty = newQty;
        if (!LIST_CATS.has(newCat)) item.checked = false;
      }
      save(); render();
    } else if (action === 'cancel') {
      document.getElementById(`edit-${id}`)?.classList.remove('open');
    }
  });

  // ── 11. Artikel hinzufügen ────────────────────────────────────────────
  document.getElementById('btn-add').addEventListener('click', () => {
    const nameEl = document.getElementById('inp-name');
    const name   = nameEl.value.trim();
    const cat    = document.getElementById('inp-cat').value;
    const qty    = parseInt(document.getElementById('inp-qty').value, 10);
    if (!name) { nameEl.focus(); return; }
    if (isNaN(qty) || qty < 0) return;
    items.push({ id: uid(), name, cat, qty, checked: false });
    save(); render();
    nameEl.value = '';
    document.getElementById('inp-qty').value = '1';
    nameEl.focus();
  });

  document.getElementById('inp-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-add').click();
  });

  document.getElementById('search').addEventListener('input', render);

  // ── 12. Init ──────────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
