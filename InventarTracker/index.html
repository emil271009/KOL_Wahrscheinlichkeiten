<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventar-Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --bg2:       #f5f5f3;
      --bg3:       #eeecea;
      --text:      #1a1a18;
      --muted:     #888780;
      --border:    rgba(0,0,0,0.11);
      --border2:   rgba(0,0,0,0.18);
      --rmd:       8px;
      --rlg:       12px;
      --low:       #D85A30;
      --check-bg:  #EAF3DE;
      --check-bd:  #3B6D11;
      --check-tick:#27500A;
      --sidebar:   270px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #1e1e1c;
        --bg2:       #2a2a28;
        --bg3:       #333330;
        --text:      #f0ede6;
        --muted:     #888780;
        --border:    rgba(255,255,255,0.10);
        --border2:   rgba(255,255,255,0.18);
        --check-bg:  #27500A;
        --check-bd:  #639922;
        --check-tick:#C0DD97;
      }
    }

    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg2); color: var(--text); min-height: 100vh; }
    .shell { display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { padding: .9rem 1.25rem; border-bottom: .5px solid var(--border); background: var(--bg); }
    .topbar h1 { font-size: 18px; font-weight: 500; }
    .body { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar); flex-shrink: 0;
      background: var(--bg); border-right: .5px solid var(--border);
      display: flex; flex-direction: column; padding: 1rem .875rem; gap: 10px;
    }
    .sidebar-title { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .btn-new-cat { width: 100%; height: 32px; background: none; border: .5px solid var(--border2); border-radius: var(--rmd); font-size: 12px; color: var(--text); cursor: pointer; transition: background .15s; }
    .btn-new-cat:hover { background: var(--bg2); }
    .new-cat-row { display: none; gap: 6px; }
    .new-cat-row.open { display: flex; }
    .new-cat-row input { flex: 1; height: 30px; padding: 0 8px; font-size: 12px; color: var(--text); background: var(--bg2); border: .5px solid var(--border2); border-radius: var(--rmd); outline: none; }
    .new-cat-row button { height: 30px; padding: 0 10px; font-size: 12px; background: var(--text); color: var(--bg); border: none; border-radius: var(--rmd); cursor: pointer; }
    .err-cat { font-size: 11px; color: var(--low); min-height: 14px; }
    .cat-list { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }

    /* Kategorie-Eintrag */
    .cat-item { position: relative; border-radius: var(--rmd); border: .5px solid transparent; transition: background .15s; }
    .cat-item:hover { background: var(--bg2); }
    .cat-item.active { background: var(--bg3); border-color: var(--border2); }
    .cat-main { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer; font-size: 13px; color: var(--text); }
    .cat-item.active .cat-main { font-weight: 500; }

    /* Farb-Dot */
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .cat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-count { font-size: 11px; color: var(--muted); }

    /* ⋯ Menü-Button — erscheint beim Hover */
    .cat-menu-btn {
      background: none; border: none; cursor: pointer; color: var(--muted);
      padding: 2px 4px; line-height: 1; border-radius: 4px;
      font-size: 14px; letter-spacing: 1px;
      opacity: 0; transition: opacity .15s, color .15s; flex-shrink: 0;
    }
    .cat-item:hover .cat-menu-btn { opacity: 1; }
    .cat-menu-btn:hover { color: var(--text); }

    /* Dropdown-Menü */
    .cat-dropdown { display: none; flex-direction: column; gap: 1px; padding: 5px; background: var(--bg); border: .5px solid var(--border2); border-radius: var(--rlg); margin: 0 6px 4px; }
    .cat-dropdown.open { display: flex; }

    .dd-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--rmd); font-size: 12px; color: var(--text); cursor: pointer; background: none; border: none; width: 100%; text-align: left; transition: background .15s; }
    .dd-item:hover { background: var(--bg2); }
    .dd-item.danger { color: #D85A30; }
    .dd-item.danger:hover { background: #FAECE7; }
    .dd-sep { height: .5px; background: var(--border); margin: 3px 0; }

    /* Umbenennen-Zeile */
    .cat-rename-row { display: none; gap: 5px; padding: 4px 6px 6px; align-items: center; }
    .cat-rename-row.open { display: flex; }
    .cat-rename-row input { flex: 1; height: 28px; padding: 0 7px; font-size: 12px; color: var(--text); background: var(--bg2); border: .5px solid var(--border2); border-radius: var(--rmd); outline: none; }
    .cat-rename-row button { height: 28px; padding: 0 9px; font-size: 12px; background: var(--text); color: var(--bg); border: none; border-radius: var(--rmd); cursor: pointer; }

    /* Farbpicker */
    .color-picker-row { display: none; flex-wrap: wrap; gap: 6px; padding: 4px 8px 8px; }
    .color-picker-row.open { display: flex; }
    .color-swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .12s, border-color .12s; flex-shrink: 0; }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: var(--text); }

    /* Listen-Toggle */
    .dd-toggle { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--rmd); font-size: 12px; color: var(--text); cursor: pointer; width: 100%; transition: background .15s; }
    .dd-toggle:hover { background: var(--bg2); }
    .toggle-track { width: 28px; height: 16px; border-radius: 8px; background: var(--bg3); border: .5px solid var(--border2); position: relative; transition: background .2s; flex-shrink: 0; }
    .toggle-track.on { background: var(--check-bd); }
    .toggle-thumb { position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: left .2s, background .2s; }
    .toggle-track.on .toggle-thumb { left: 14px; background: #fff; }

    .sidebar-sep { height: .5px; background: var(--border); margin: 2px 0; }
    .restore-hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .restore-btn { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0; }
    .restore-btn:hover { color: var(--text); }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-strip { display: flex; gap: 12px; align-items: flex-start; padding: 1rem 1.25rem; border-bottom: .5px solid var(--border); background: var(--bg); }
    .form-card { flex: 1; background: var(--bg2); border: .5px solid var(--border); border-radius: var(--rlg); padding: .875rem 1rem; }
    .form-head { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 72px; gap: 8px; }
    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .field input, .field select { width: 100%; height: 34px; padding: 0 9px; font-size: 13px; color: var(--text); background: var(--bg); border: .5px solid var(--border2); border-radius: var(--rmd); outline: none; transition: border-color .15s; }
    .field input:focus, .field select:focus { border-color: rgba(128,128,128,.5); }
    .btn-add { width: 100%; margin-top: 8px; height: 34px; background: var(--text); color: var(--bg); border: none; border-radius: var(--rmd); font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
    .btn-add:hover { opacity: .8; }
    .stat-card { width: 110px; flex-shrink: 0; background: var(--bg2); border: .5px solid var(--border); border-radius: var(--rlg); padding: .875rem 1rem; display: flex; flex-direction: column; justify-content: center; }
    .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.35; }
    .stat-value { font-size: 28px; font-weight: 500; }

    .content { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 12px; }
    #search { width: 100%; height: 34px; padding: 0 10px; font-size: 13px; color: var(--text); background: var(--bg); border: .5px solid var(--border); border-radius: var(--rmd); outline: none; }
    #search:focus { border-color: rgba(128,128,128,.5); }

    .list-progress { display: none; align-items: center; gap: 10px; }
    .list-progress.visible { display: flex; }
    .progress-bar { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; background: var(--check-bd); transition: width .3s; }
    .progress-lbl { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .list-header { font-size: 13px; font-weight: 500; padding-bottom: 4px; border-bottom: .5px solid var(--border); }

    /* ── Artikelliste ── */
    .item-list { display: flex; flex-direction: column; gap: 5px; }
    .item { background: var(--bg); border: .5px solid var(--border); border-radius: var(--rmd); padding: .65rem .9rem; transition: opacity .2s; }
    .item.checked { opacity: .5; }
    .item.checked .item-name { text-decoration: line-through; color: var(--muted); }
    .item-row { display: flex; align-items: center; gap: 9px; }
    .check-wrap { flex-shrink: 0; width: 18px; height: 18px; cursor: pointer; display: none; }
    .check-wrap input { display: none; }
    .check-box { width: 18px; height: 18px; border-radius: 4px; border: .5px solid var(--border2); background: var(--bg2); display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
    .check-box svg { opacity: 0; transition: opacity .15s; }
    .check-wrap input:checked ~ .check-box { background: var(--check-bg); border-color: var(--check-bd); }
    .check-wrap input:checked ~ .check-box svg { opacity: 1; }
    .item-name { flex: 1; font-size: 14px; font-weight: 500; }
    .item-cat { font-size: 11px; padding: 2px 7px; border-radius: var(--rmd); background: var(--bg2); color: var(--muted); white-space: nowrap; }
    .list-badge { font-size: 11px; padding: 2px 7px; border-radius: var(--rmd); font-weight: 500; white-space: nowrap; }
    .list-badge.pack { background: #E1F5EE; color: #085041; }
    .list-badge.shop { background: #E6F1FB; color: #0C447C; }
    .qty-ctrl { display: flex; align-items: center; gap: 3px; }
    .qty-btn { width: 24px; height: 24px; background: none; border: .5px solid var(--border); border-radius: var(--rmd); font-size: 14px; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; transition: background .12s; }
    .qty-btn:hover { background: var(--bg2); }
    .qty-val { font-size: 13px; font-weight: 500; min-width: 24px; text-align: center; }
    .qty-val.low { color: var(--low); }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 3px; border-radius: 4px; display: flex; align-items: center; transition: color .15s; }
    .icon-btn.edit:hover { color: var(--text); }
    .icon-btn.del:hover { color: #E24B4A; }
    .edit-row { display: none; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: .5px solid var(--border); }
    .edit-row.open { display: grid; }
    .edit-row input, .edit-row select { height: 32px; padding: 0 8px; font-size: 12px; color: var(--text); background: var(--bg2); border: .5px solid var(--border); border-radius: var(--rmd); outline: none; width: 100%; }
    .edit-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .edit-actions { display: flex; gap: 5px; margin-top: 7px; }
    .btn-save { flex: 1; height: 30px; background: var(--text); color: var(--bg); border: none; border-radius: var(--rmd); font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
    .btn-save:hover { opacity: .8; }
    .btn-cancel { flex: 1; height: 30px; background: none; border: .5px solid var(--border); border-radius: var(--rmd); font-size: 12px; color: var(--text); cursor: pointer; transition: background .15s; }
    .btn-cancel:hover { background: var(--bg2); }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 13px; }

    @media (max-width: 640px) {
      .body { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: .5px solid var(--border); }
      .top-strip { flex-wrap: wrap; }
      .stat-card { width: 100%; }
      .form-grid { grid-template-columns: 1fr 1fr; }
      .form-grid .field:first-child { grid-column: span 2; }
      .edit-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="shell">
  <div class="topbar"><h1>Inventar-Tracker</h1></div>
  <div class="body">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="sidebar-title">Kategorien</div>
      <button class="btn-new-cat" id="btn-open-new-cat">+ Kategorie hinzufügen</button>
      <div class="new-cat-row" id="new-cat-row">
        <input type="text" id="inp-new-cat" placeholder="Name..." maxlength="30" autocomplete="off"/>
        <button id="btn-cat-add">OK</button>
      </div>
      <div class="err-cat" id="err-cat"></div>
      <div class="cat-list" id="cat-list"></div>
      <div id="restore-area" style="display:none">
        <div class="sidebar-sep"></div>
        <div class="restore-hint">Gelöscht: <span id="deleted-list"></span><br>
          <button class="restore-btn" id="btn-restore">Alle wiederherstellen</button>
        </div>
      </div>
    </aside>

    <!-- ── Main ── -->
    <main class="main">
      <div class="top-strip">
        <div class="form-card">
          <div class="form-head" id="form-head">Artikel hinzufügen</div>
          <div class="form-grid">
            <div class="field"><label>Name</label><input type="text" id="inp-name" placeholder="z.B. Laptop" autocomplete="off"/></div>
            <div class="field"><label>Kategorie</label><select id="inp-cat"></select></div>
            <div class="field"><label>Menge</label><input type="number" id="inp-qty" min="0" value="1"/></div>
          </div>
          <button class="btn-add" id="btn-add">+ Hinzufügen</button>
        </div>
        <div class="stat-card">
          <div class="stat-label" id="stat-label">Alle<br>Kategorien</div>
          <div class="stat-value" id="stat-value">0</div>
        </div>
      </div>
      <div class="content">
        <input type="text" id="search" placeholder="Suchen…" autocomplete="off"/>
        <div class="list-progress" id="list-progress">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
          <span class="progress-lbl" id="progress-lbl">0 / 0</span>
        </div>
        <div class="list-header" id="list-header">Alle Artikel</div>
        <div class="item-list" id="item-list"></div>
        <div class="empty" id="empty" style="display:none">Keine Artikel gefunden.</div>
      </div>
    </main>
  </div>
</div>

<script>
  // ── 1. Konstanten ─────────────────────────────────────────────────────
  const ALL_BUILTIN = ['Packliste','Einkaufsliste','Elektronik','Büro','Werkzeug','Lebensmittel','Kleidung','Sonstiges'];
  const LIST_CATS_DEFAULT = new Set(['Packliste','Einkaufsliste']);

  // Farbpalette für den Picker (8 Farben)
  const COLORS     = ['#888780','#1D9E75','#378ADD','#D85A30','#7F77DD','#D4537E','#BA7517','#639922'];
  const COLOR_NAMES = ['Grau','Grün','Blau','Orange','Lila','Pink','Amber','Hellgrün'];

  // ── 2. State ──────────────────────────────────────────────────────────
  let items=[], customCats=[], deletedBuiltin=[];
  // catMeta speichert pro Kategorie: { color: string, isList: boolean }
  let catMeta = {};
  try {
    items          = JSON.parse(localStorage.getItem('inventar_items')    || '[]');
    customCats     = JSON.parse(localStorage.getItem('inventar_cats')     || '[]');
    deletedBuiltin = JSON.parse(localStorage.getItem('inventar_del_cats') || '[]');
    catMeta        = JSON.parse(localStorage.getItem('inventar_catmeta')  || '{}');
  } catch(e) {}

  let activeCat  = '';
  let openMenuCat = null; // welches Kategorie-Menü aktuell offen ist

  function builtinActive() { return ALL_BUILTIN.filter(c => !deletedBuiltin.includes(c)); }
  function allCats()       { return [...builtinActive(), ...customCats]; }

  // Checkbox-Funktion: entweder Standard-Listen-Kat oder per Toggle aktiviert
  function isListCat(cat) {
    if (LIST_CATS_DEFAULT.has(cat)) return true;
    return catMeta[cat]?.isList === true;
  }

  // Kategorie-Farbe aus catMeta, Fallback grau
  function getCatColor(cat) {
    return catMeta[cat]?.color || '#888780';
  }

  function save() {
    localStorage.setItem('inventar_items',    JSON.stringify(items));
    localStorage.setItem('inventar_cats',     JSON.stringify(customCats));
    localStorage.setItem('inventar_del_cats', JSON.stringify(deletedBuiltin));
    localStorage.setItem('inventar_catmeta',  JSON.stringify(catMeta));
  }
  function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Alle offenen Dropdown-Menüs schließen
  function closeAllMenus() {
    document.querySelectorAll('.cat-dropdown.open').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.cat-rename-row.open').forEach(r => r.classList.remove('open'));
    document.querySelectorAll('.color-picker-row.open').forEach(r => r.classList.remove('open'));
    openMenuCat = null;
  }

  // ── 3. Sidebar rendern ────────────────────────────────────────────────
  function renderSidebar() {
    const cats = allCats();
    const list = document.getElementById('cat-list');

    // "Alle"-Eintrag (kein Menü-Button)
    const allEntry = `<div class="cat-item${activeCat===''?' active':''}" data-cat="">
      <div class="cat-main">
        <span class="cat-dot" style="background:var(--muted)"></span>
        <span class="cat-name">Alle</span>
        <span class="cat-count">${items.length}</span>
      </div>
    </div>`;

    // Einträge pro Kategorie mit ⋯-Menü
    const catEntries = cats.map(c => {
      const count    = items.filter(i => i.cat === c).length;
      const color    = getCatColor(c);
      const isList   = isListCat(c);
      const menuOpen = openMenuCat === c;

      return `<div class="cat-item${activeCat===c?' active':''}" data-cat="${esc(c)}">
        <div class="cat-main">
          <span class="cat-dot" style="background:${color}"></span>
          <span class="cat-name">${esc(c)}</span>
          <span class="cat-count">${count}</span>
          <button class="cat-menu-btn" data-menu="${esc(c)}" title="Einstellungen">&#8943;</button>
        </div>

        <!-- Dropdown: klappt inline auf, kein fixed-Positioning -->
        <div class="cat-dropdown${menuOpen?' open':''}" id="menu-${esc(c)}">

          <!-- Umbenennen -->
          <button class="dd-item" data-action="rename-open" data-cat="${esc(c)}">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2l3 3-9 9H2v-3L11 2z"/></svg>
            Umbenennen
          </button>
          <div class="cat-rename-row" id="rename-${esc(c)}">
            <input type="text" class="rename-inp" value="${esc(c)}" maxlength="30" data-oldcat="${esc(c)}"/>
            <button data-action="rename-save" data-cat="${esc(c)}">OK</button>
          </div>

          <!-- Farbe wählen -->
          <button class="dd-item" data-action="color-open" data-cat="${esc(c)}">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2" fill="currentColor" stroke="none"/></svg>
            Farbe wählen
          </button>
          <div class="color-picker-row" id="colors-${esc(c)}">
            ${COLORS.map((col,i) => `<div class="color-swatch${color===col?' selected':''}" style="background:${col}" data-action="set-color" data-cat="${esc(c)}" data-color="${col}" title="${COLOR_NAMES[i]}"></div>`).join('')}
          </div>

          <!-- Checkboxen-Toggle -->
          <div class="dd-toggle" data-action="toggle-list" data-cat="${esc(c)}">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,5 6,9 14,3"/><line x1="2" y1="11" x2="10" y2="11"/><line x1="2" y1="14" x2="7" y2="14"/></svg>
            <span style="flex:1">Checkboxen</span>
            <div class="toggle-track${isList?' on':''}"><div class="toggle-thumb"></div></div>
          </div>

          <div class="dd-sep"></div>

          <!-- Löschen -->
          <button class="dd-item danger" data-action="cat-del" data-cat="${esc(c)}">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,4 13,4"/><path d="M5 4V3h6v1"/><rect x="4" y="4" width="8" height="10" rx="1"/></svg>
            Löschen
          </button>
        </div>
      </div>`;
    }).join('');

    list.innerHTML = allEntry + catEntries;

    // Wiederherstellungs-Bereich
    const restoreArea = document.getElementById('restore-area');
    if (deletedBuiltin.length > 0) {
      document.getElementById('deleted-list').textContent = deletedBuiltin.join(', ');
      restoreArea.style.display = 'block';
    } else { restoreArea.style.display = 'none'; }

    // Formular-Dropdown synchron
    const selCat   = document.getElementById('inp-cat');
    const prevCat  = selCat.value;
    const allNow   = allCats();
    selCat.innerHTML = allNow.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if (allNow.includes(prevCat)) selCat.value = prevCat;
    else if (activeCat && allNow.includes(activeCat)) selCat.value = activeCat;
  }

  // ── 4. Stat-Kachel ────────────────────────────────────────────────────
  function updateStat() {
    const labelEl = document.getElementById('stat-label');
    const valEl   = document.getElementById('stat-value');
    const headEl  = document.getElementById('form-head');
    const hdrEl   = document.getElementById('list-header');
    if (activeCat === '') {
      labelEl.innerHTML  = 'Alle<br>Kategorien';
      valEl.textContent  = items.length;
      headEl.textContent = 'Artikel hinzufügen';
      hdrEl.textContent  = 'Alle Artikel';
    } else {
      labelEl.innerHTML  = 'Artikel in<br><strong style="font-weight:500">' + esc(activeCat) + '</strong>';
      valEl.textContent  = items.filter(i => i.cat === activeCat).length;
      headEl.textContent = 'Artikel aus „' + activeCat + '"';
      hdrEl.textContent  = activeCat;
    }
  }

  // ── 5. Fortschrittsleiste ─────────────────────────────────────────────
  function updateProgress() {
    const prog = document.getElementById('list-progress');
    if (!isListCat(activeCat) || activeCat === '') { prog.classList.remove('visible'); return; }
    prog.classList.add('visible');
    const inCat   = items.filter(i => i.cat === activeCat);
    const checked = inCat.filter(i => i.checked).length;
    const total   = inCat.length;
    const pct     = total === 0 ? 0 : Math.round(checked / total * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-lbl').textContent  = checked + ' / ' + total;
  }

  // ── 6. Artikelliste rendern ───────────────────────────────────────────
  function render() {
    const q    = document.getElementById('search').value.toLowerCase();
    const cats = allCats();

    const filtered = items.filter(i =>
      i.name.toLowerCase().includes(q) && (activeCat === '' || i.cat === activeCat)
    );

    const list  = document.getElementById('item-list');
    const empty = document.getElementById('empty');
    list.innerHTML = '';

    if (filtered.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      filtered.forEach(item => {
        const isList = isListCat(item.cat);
        const el = document.createElement('div');
        el.className = 'item' + (item.checked ? ' checked' : '');
        el.dataset.id = item.id;

        const catOpts = cats.map(c =>
          `<option value="${esc(c)}"${c === item.cat ? ' selected' : ''}>${esc(c)}</option>`
        ).join('');

        const catColor = getCatColor(item.cat);

        // Badge: Standard-Listen-Kategorien bekommen festes Design,
        // custom Listen-Kats bekommen die gewählte Farbe
        const badgeHtml = LIST_CATS_DEFAULT.has(item.cat)
          ? `<span class="list-badge ${item.cat === 'Packliste' ? 'pack' : 'shop'}">${esc(item.cat)}</span>`
          : isList
            ? `<span class="item-cat" style="background:${catColor}20;color:${catColor}">${esc(item.cat)}</span>`
            : `<span class="item-cat">${esc(item.cat)}</span>`;

        el.innerHTML = `
          <div class="item-row">
            <label class="check-wrap" style="display:${isList ? 'block' : 'none'}">
              <input type="checkbox" data-action="check" data-id="${item.id}"${item.checked ? ' checked' : ''}>
              <div class="check-box">
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none"
                     stroke="var(--check-tick)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="2,6 5,9 10,3"/>
                </svg>
              </div>
            </label>
            <span class="item-name">${esc(item.name)}</span>
            ${badgeHtml}
            <div class="qty-ctrl">
              <button class="qty-btn" data-action="dec" data-id="${item.id}">&#x2212;</button>
              <span class="qty-val${item.qty < 5 ? ' low' : ''}">${item.qty}</span>
              <button class="qty-btn" data-action="inc" data-id="${item.id}">+</button>
            </div>
            <button class="icon-btn edit" data-action="edit" data-id="${item.id}" title="Bearbeiten">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2l3 3-9 9H2v-3L11 2z"/></svg>
            </button>
            <button class="icon-btn del" data-action="del" data-id="${item.id}" title="Löschen">&#x2715;</button>
          </div>
          <div class="edit-row" id="edit-${item.id}">
            <div><label>Name</label><input type="text" class="edit-name" value="${esc(item.name)}" maxlength="80"/></div>
            <div><label>Kategorie</label><select class="edit-cat">${catOpts}</select></div>
            <div><label>Menge</label><input type="number" class="edit-qty" value="${item.qty}" min="0"/></div>
            <div style="display:flex;align-items:flex-end">
              <div class="edit-actions" style="width:100%">
                <button class="btn-save" data-action="save" data-id="${item.id}">Speichern</button>
                <button class="btn-cancel" data-action="cancel" data-id="${item.id}">Abbrechen</button>
              </div>
            </div>
          </div>`;
        list.appendChild(el);
      });
    }

    renderSidebar();
    updateStat();
    updateProgress();
  }

  // ── 7. Sidebar-Klicks ─────────────────────────────────────────────────
  document.getElementById('cat-list').addEventListener('click', e => {

    // ⋯ Menü-Button: Dropdown öffnen/schließen
    const menuBtn = e.target.closest('.cat-menu-btn');
    if (menuBtn) {
      e.stopPropagation();
      const cat = menuBtn.dataset.menu;
      if (openMenuCat === cat) { closeAllMenus(); }
      else { closeAllMenus(); openMenuCat = cat; document.getElementById(`menu-${cat}`)?.classList.add('open'); }
      return;
    }

    // Aktionen im Dropdown
    const actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      e.stopPropagation();
      const { action, cat } = actionEl.dataset;

      if (action === 'rename-open') {
        const row = document.getElementById(`rename-${cat}`);
        const isOpen = row.classList.contains('open');
        document.querySelectorAll('.cat-rename-row.open').forEach(r => r.classList.remove('open'));
        document.querySelectorAll('.color-picker-row.open').forEach(r => r.classList.remove('open'));
        if (!isOpen) { row.classList.add('open'); row.querySelector('input').focus(); }
        return;
      }

      if (action === 'rename-save') {
        const row     = document.getElementById(`rename-${cat}`);
        const newName = row.querySelector('input').value.trim();
        if (!newName) return;
        if (allCats().filter(c => c !== cat).map(c => c.toLowerCase()).includes(newName.toLowerCase())) {
          document.getElementById('err-cat').textContent = 'Name existiert bereits.'; return;
        }
        document.getElementById('err-cat').textContent = '';
        // Artikel umhängen
        items.forEach(i => { if (i.cat === cat) i.cat = newName; });
        // Meta übertragen
        if (catMeta[cat]) { catMeta[newName] = catMeta[cat]; delete catMeta[cat]; }
        const idx = customCats.indexOf(cat);
        if (idx > -1) customCats[idx] = newName;
        if (activeCat === cat) activeCat = newName;
        closeAllMenus();
        save(); render(); return;
      }

      if (action === 'color-open') {
        const row    = document.getElementById(`colors-${cat}`);
        const isOpen = row.classList.contains('open');
        document.querySelectorAll('.color-picker-row.open').forEach(r => r.classList.remove('open'));
        document.querySelectorAll('.cat-rename-row.open').forEach(r => r.classList.remove('open'));
        if (!isOpen) row.classList.add('open');
        return;
      }

      if (action === 'set-color') {
        if (!catMeta[cat]) catMeta[cat] = {};
        catMeta[cat].color = actionEl.dataset.color;
        save(); render(); return;
      }

      if (action === 'toggle-list') {
        if (!catMeta[cat]) catMeta[cat] = {};
        catMeta[cat].isList = !isListCat(cat);
        // Beim Deaktivieren: alle checked-Zustände in dieser Kategorie zurücksetzen
        if (!catMeta[cat].isList) items.forEach(i => { if (i.cat === cat) i.checked = false; });
        save(); render(); return;
      }

      if (action === 'cat-del') {
        if (items.some(i => i.cat === cat)) {
          document.getElementById('err-cat').textContent = `"${cat}" wird noch verwendet.`; return;
        }
        document.getElementById('err-cat').textContent = '';
        if (ALL_BUILTIN.includes(cat)) deletedBuiltin.push(cat);
        else customCats = customCats.filter(c => c !== cat);
        if (activeCat === cat) activeCat = '';
        closeAllMenus();
        save(); render(); return;
      }
      return;
    }

    // Klick auf Kategorie-Eintrag = Filter setzen
    const catItem = e.target.closest('.cat-item');
    if (catItem && !e.target.closest('.cat-dropdown')) {
      closeAllMenus();
      activeCat = catItem.dataset.cat;
      const sel = document.getElementById('inp-cat');
      if (activeCat && [...sel.options].some(o => o.value === activeCat)) sel.value = activeCat;
      render();
    }
  });

  // Klick außerhalb schließt alle Menüs
  document.addEventListener('click', e => {
    if (!e.target.closest('.cat-item')) closeAllMenus();
  });

  // ── 8. Neue Kategorie ─────────────────────────────────────────────────
  document.getElementById('btn-open-new-cat').addEventListener('click', () => {
    const row = document.getElementById('new-cat-row');
    row.classList.toggle('open');
    if (row.classList.contains('open')) document.getElementById('inp-new-cat').focus();
  });

  document.getElementById('btn-cat-add').addEventListener('click', () => {
    const inp  = document.getElementById('inp-new-cat');
    const err  = document.getElementById('err-cat');
    const name = inp.value.trim();
    if (!name) { err.textContent = 'Name eingeben.'; return; }
    if (allCats().map(c => c.toLowerCase()).includes(name.toLowerCase())) { err.textContent = 'Existiert bereits.'; return; }
    if (deletedBuiltin.map(c => c.toLowerCase()).includes(name.toLowerCase())) { err.textContent = 'Tipp: Unten wiederherstellen.'; return; }
    err.textContent = '';
    customCats.push(name);
    save(); inp.value = '';
    document.getElementById('new-cat-row').classList.remove('open');
    render();
  });

  document.getElementById('inp-new-cat').addEventListener('keydown', e => {
    if (e.key === 'Enter')  document.getElementById('btn-cat-add').click();
    if (e.key === 'Escape') document.getElementById('new-cat-row').classList.remove('open');
  });

  // ── 9. Standardkategorien wiederherstellen ────────────────────────────
  document.getElementById('btn-restore').addEventListener('click', () => {
    deletedBuiltin = [];
    document.getElementById('err-cat').textContent = '';
    save(); render();
  });

  // ── 10. Artikel-Aktionen ──────────────────────────────────────────────
  document.getElementById('item-list').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const { action, id } = btn.dataset;

    if (action === 'check') {
      const item = items.find(i => i.id === id);
      if (item) item.checked = btn.checked;
      save(); render();
    } else if (action === 'del') {
      items = items.filter(i => i.id !== id);
      save(); render();
    } else if (action === 'inc' || action === 'dec') {
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (action === 'inc') item.qty += 1;
      if (action === 'dec' && item.qty > 0) item.qty -= 1;
      save(); render();
    } else if (action === 'edit') {
      document.querySelectorAll('.edit-row.open').forEach(r => { if (r.id !== `edit-${id}`) r.classList.remove('open'); });
      document.getElementById(`edit-${id}`)?.classList.toggle('open');
    } else if (action === 'save') {
      const row     = document.getElementById(`edit-${id}`);
      const newName = row.querySelector('.edit-name').value.trim();
      const newCat  = row.querySelector('.edit-cat').value;
      const newQty  = parseInt(row.querySelector('.edit-qty').value, 10);
      if (!newName || isNaN(newQty) || newQty < 0) return;
      const item = items.find(i => i.id === id);
      if (item) {
        item.name = newName; item.cat = newCat; item.qty = newQty;
        if (!isListCat(newCat)) item.checked = false;
      }
      save(); render();
    } else if (action === 'cancel') {
      document.getElementById(`edit-${id}`)?.classList.remove('open');
    }
  });

  // ── 11. Artikel hinzufügen ────────────────────────────────────────────
  document.getElementById('btn-add').addEventListener('click', () => {
    const nameEl = document.getElementById('inp-name');
    const name   = nameEl.value.trim();
    const cat    = document.getElementById('inp-cat').value;
    const qty    = parseInt(document.getElementById('inp-qty').value, 10);
    if (!name) { nameEl.focus(); return; }
    if (isNaN(qty) || qty < 0) return;
    items.push({ id: uid(), name, cat, qty, checked: false });
    save(); render();
    nameEl.value = '';
    document.getElementById('inp-qty').value = '1';
    nameEl.focus();
  });

  document.getElementById('inp-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-add').click();
  });

  document.getElementById('search').addEventListener('input', render);

  // ── 12. Init ──────────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
